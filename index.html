<!doctype html>
<!-- Defaults are Arabic + light; the script below swaps in a stored preference. -->
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to anything
         other than 0 — the bottom-pinned bars (save bar, selection bar, drawer foot)
         read it so they clear the iOS home indicator. No `maximum-scale`/`user-scalable`:
         pinch-zoom stays available. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>BrokerOS</title>
    <!-- Type system: Bricolage Grotesque (display) · IBM Plex Sans + Arabic (body,
         solves AR/EN) · IBM Plex Mono (the "register" voice — reference codes, data). -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // No-FOUC: apply persisted theme + language direction before React mounts.
      (function () {
        try {
          // Light is the default, NOT the OS preference: a broker showing a property
          // on a phone in daylight gets the register in ink-on-paper unless they have
          // chosen otherwise. 'system' is still available from the toggle.
          var stored = localStorage.getItem('brokeros-theme');
          var theme = 'light';
          if (stored) {
            var parsed = JSON.parse(stored);
            theme = (parsed && parsed.state && parsed.state.theme) || 'light';
          }
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = theme === 'dark' || (theme === 'system' && prefersDark);
          document.documentElement.classList.toggle('dark', isDark);

          // Arabic unless the visitor has picked otherwise — the office works in it.
          var lng = localStorage.getItem('i18nextLng') || 'ar';
          var lang = lng.indexOf('ar') === 0 ? 'ar' : 'en';
          document.documentElement.setAttribute('lang', lang);
          document.documentElement.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          /* localStorage unavailable — fall back to markup defaults */
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-CTpy1B-L.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-CZB22dfn.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
